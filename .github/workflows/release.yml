name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true

      - name: Build Hum.app (Release)
        run: |
          xcodebuild build \
            -scheme Hum \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO

      - name: Build HumSaver (Release)
        run: |
          xcodebuild build \
            -scheme HumSaver \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Distribution Bundle
        run: |
          mkdir -p dist
          cp -R build/DD/Build/Products/Release/Hum.app dist/
          cp -R build/DD/Build/Products/Release/Hum.saver dist/
          cd dist
          zip -r -y ../Hum-${{ github.ref_name }}.zip Hum.app Hum.saver
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Hum-${{ github.ref_name }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false

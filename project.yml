name: Hum
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.4"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  Hum:
    type: application
    platform: macOS
    sources:
      - path: Hum
        excludes:
          - "**/*.entitlements"
          - "**/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.hum
        PRODUCT_NAME: Hum
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Hum/Hum.entitlements
        INFOPLIST_FILE: Hum/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "5"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: HumSaver
        embed: true
        copy:
          destination: resources

  # The Hum screensaver. Shares the scene and effect code with the app; it gets now-playing
  # data from a feed file the app writes (see ScreensaverFeed).
  HumSaver:
    type: bundle
    platform: macOS
    sources:
      - path: HumSaver
        excludes:
          - "Info.plist"
      - Hum/Effects
      - Hum/Surfaces/Cinematic/CinematicScene.swift
      - Hum/Surfaces/Cinematic/MusicBar.swift
      - Hum/Surfaces/Island/PlaybackBars.swift
      - Hum/Surfaces/Cinematic/CinematicRefraction.metal
      - Hum/Surfaces/Cinematic/CinematicEdgeGlow.metal
      - Hum/Surfaces/Cinematic/DisplayEdgeGeometry.swift
      - Hum/Surfaces/Cinematic/DisplayEdgeGlow.swift
      - Hum/Surfaces/Cinematic/MonochromeArtwork.swift
      - Hum/Surfaces/Cinematic/ScreensaverFeed.swift
      - Hum/Surfaces/Cinematic/ScreensaverCommand.swift
      - Hum/Lyrics/WordTimingEstimator.swift
      - Hum/Lyrics/LyricsModels.swift
      - Hum/Playback/AlbumPalette.swift
      - Hum/App/SettingsTypes.swift
    settings:
      base:
        PRODUCT_NAME: Hum
        PRODUCT_MODULE_NAME: HumSaver
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.hum.saver
        WRAPPER_EXTENSION: saver
        INFOPLIST_FILE: HumSaver/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "5"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  HumTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HumTests
    dependencies:
      - target: Hum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.hum.tests
        GENERATE_INFOPLIST_FILE: YES

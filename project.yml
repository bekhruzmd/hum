name: Hum
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.4"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  Hum:
    type: application
    platform: macOS
    sources:
      - path: Hum
        excludes:
          - "**/*.entitlements"
          - "**/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.hum
        PRODUCT_NAME: Hum
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Hum/Hum.entitlements
        INFOPLIST_FILE: Hum/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  HumTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HumTests
    dependencies:
      - target: Hum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.hum.tests
        GENERATE_INFOPLIST_FILE: YES
